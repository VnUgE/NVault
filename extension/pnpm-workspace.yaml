# pnpm configuration (managed via pnpm-workspace.yaml since pnpm v10).
#
# All dependency lifecycle scripts (install/postinstall/preinstall) are
# blocked by default for supply-chain protection. Only packages whose
# install scripts are verified as required for correct operation are
# allowed to run, one per line:
#
# onlyBuiltDependencies:
#   - <package>

# Verified as required (package is non-functional without its install script):
#   - esbuild          -> postinstall installs the platform-specific native binary
#   - vue-demi         -> postinstall selects the correct vue version shim (used by @vueuse)
#   - @parcel/watcher  -> install falls back to native binding when platform package is missing
#   - spawn-sync       -> postinstall unpacks the bundled npm package it executes (used by web-ext)
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  spawn-sync: true
  vue-demi: true
onlyBuiltDependencies:
  - esbuild
  - vue-demi
  - "@parcel/watcher"
  - spawn-sync

# Transitive dependency security overrides (no upstream fix published yet).
# Remove each entry once the direct dependency releases a patched constraint.
overrides:
  shell-quote: "^1.10.0"
  content-security-policy-parser: "^0.6.0"
  tmp: "^0.2.7"
  adm-zip: "^0.6.0"
  uuid: "^11.1.1"
